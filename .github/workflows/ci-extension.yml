# Seeded by vigOS devkit — yours to edit; upgrades never overwrite this file.
# Bugs / missing tools: https://github.com/vig-os/devkit/issues

#
# Called unconditionally from the managed ci.yml as the `extension` job and
# aggregated by the CI Summary gate — a failing or cancelled job here blocks
# the merge exactly like lint/test/commit-checks. Every input is
# `required: false`: this file is a preserved, consumer-owned contract, so a
# later devkit release can add an input without breaking an existing copy.
# `runs-on` resolves from `runner-json` (the same DEVKIT_CI_RUNNER-derived
# value the rest of ci.yml uses) rather than a literal label, so a self-hosted
# consumer's own runners pick this job up too, and so actionlint keeps linting
# clean once you start editing below (it does not know every hosted label).
# See "CI Extension Hook" in docs/DOWNSTREAM_RELEASE.md.

name: CI Extension

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      mode:
        description: "Resolved delivery mode (devcontainer/direnv/both/bare)"
        required: false
        type: string
      image:
        description: "Resolved container image (empty string in host modes)"
        required: false
        type: string
      image-tag:
        description: "Resolved devkit image tag"
        required: false
        type: string
      runner-json:
        description: "JSON array of runner labels (DEVKIT_CI_RUNNER)"
        required: false
        type: string
        default: '["ubuntu-26.04"]'
      dev-profile-path:
        description: "Optional absolute path for the Nix dev-shell gcroot profile"
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Workaround for vig-os/devkit#1811; remove when the managed Tests/Lint lanes
  # run Rust. Until then `just lint`/`just test` are Python recipes that skip
  # without a pyproject.toml, so nothing else compiles or tests the crate.
  # `nix flake check` runs the crane checks from flake.nix: clippy, fmt,
  # nextest, doctests and docs.
  extension:
    name: Rust checks (nix flake check)
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Nix is required whatever the resolved delivery mode is, so the mode is
      # pinned to `direnv` (the action's only Nix path) rather than forwarded.
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv
          devkit-version: ${{ inputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          dev-profile-path: ${{ inputs.dev-profile-path }}

      - name: Validate benchmark correctness without timing assertions
        run: nix develop -c cargo test --locked --bench performance

      # Plain Cargo shares a process between library tests; nextest does not.
      - name: Cargo tests with default test threads
        run: nix develop -c cargo test --locked --lib --bins --tests --examples --all-features
      - name: Cargo tests with one test thread
        run: nix develop -c cargo test --locked --lib --bins --tests --examples --all-features -- --test-threads=1

      - name: Run nix flake check
        run: nix flake check -L

  conformance:
    name: Collector conformance
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv
          devkit-version: ${{ inputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          dev-profile-path: ${{ inputs.dev-profile-path }}
      - name: Compare rotated logs through the reference Collector
        run: |
          nix develop -c python3 -m unittest discover -s scripts
          nix develop -c python3 scripts/conformance.py

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv
          devkit-version: ${{ inputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          dev-profile-path: ${{ inputs.dev-profile-path }}
      # Live RustSec fetch needs network access unavailable in Nix derivations.
      # The executable still comes exclusively from flake-pinned nixpkgs.
      - name: Check supply-chain policy
        run: nix develop -c python3 scripts/check_supply_chain.py

  semver:
    name: Semver compatibility
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository and baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv
          devkit-version: ${{ inputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          dev-profile-path: ${{ inputs.dev-profile-path }}
      # Git baseline checkout requires history and writable storage, outside
      # the Nix derivation sandbox. The tools still come from pinned nixpkgs.
      - name: Check stable API against merge base with dev
        run: nix develop -c python3 scripts/check_semver.py

  msrv:
    name: MSRV (Linux and Apple target)
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv
          devkit-version: ${{ inputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          dev-profile-path: ${{ inputs.dev-profile-path }}
      - name: Build and test all features
        run: nix develop .#msrv -c python3 scripts/check_rust_version.py msrv

  latest-stable:
    name: Latest stable (Linux)
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv
          devkit-version: ${{ inputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          dev-profile-path: ${{ inputs.dev-profile-path }}
      - name: Build and test all features
        run: nix develop .#latest-stable -c python3 scripts/check_rust_version.py latest-stable

  performance:
    name: Performance comparison
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 30
    # Build/run/estimate failures block; only measured slowdowns are advisory.
    env:
      CARGO_TARGET_DIR: target/performance
      CARGO_BUILD_JOBS: '3'
      BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/dev' }}
      VIGIL_BENCH_QUICK: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv
          devkit-version: ${{ inputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          dev-profile-path: ${{ inputs.dev-profile-path }}
      - name: Measure merge-base and head on the same runner
        run: |
          nix develop -c python3 scripts/compare_performance.py --base-ref "$BASE_REF"

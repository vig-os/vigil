# Seeded by vigOS devkit — yours to edit; upgrades never overwrite this file.
# Bugs / missing tools: https://github.com/vig-os/devkit/issues

name: Prepare Release Extension

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      version:
        description: "Release version being prepared (X.Y.Z)"
        required: true
        type: string
      release_branch:
        description: "Release branch just created (release/X.Y.Z)"
        required: true
        type: string
      branch_sha:
        description: "Post-freeze head SHA the release branch was created from"
        required: true
        type: string
      dry_run:
        description: "Validate without making changes (extensions must honor it)"
        required: false
        default: false
        type: boolean

# The orchestrator calls this workflow with `secrets: inherit`, so a real
# extension can mint the COMMIT_APP token to push to the write-protected release
# branch — the same bypass the changelog-freeze commit already uses.
permissions:
  contents: read

# The train supplies the bare X.Y.Z version. Only the release branch is bumped;
# dev keeps the last released version until the train's release merges back.
jobs:
  extension:
    name: Set release crate version
    runs-on: ubuntu-26.04
    steps:
      - name: Generate Commit App Token
        id: commit_app_token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          client-id: ${{ secrets.COMMIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_APP_PRIVATE_KEY }}

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.release_branch }}
          persist-credentials: false

      - name: Verify post-freeze head
        env:
          BRANCH_SHA: ${{ inputs.branch_sha }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BRANCH_SHA"
          test "$RELEASE_BRANCH" = "release/$VERSION"

      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: direnv

      - name: Validate and set crate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 -I scripts/set_crate_version.py "$VERSION" "${args[@]}"
          git diff --stat
          changed=$(git diff --name-only)
          if [ -n "$changed" ]; then
            test "$changed" = "$(printf 'Cargo.lock\nCargo.toml')"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'chore(release): set crate version to %s\n' "$VERSION" > "$RUNNER_TEMP/release-message"
          validate-commit-msg "$RUNNER_TEMP/release-message"

      - name: Commit crate version to release branch via API
        if: ${{ !inputs.dry_run && steps.version.outputs.changed == 'true' }}
        uses: vig-os/commit-action@7ba7e1ae17547813e708d4cc6a771a09f978f724  # v0.3.3
        env:
          GH_TOKEN: ${{ steps.commit_app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: refs/heads/${{ inputs.release_branch }}
          MAX_ATTEMPTS: "1"
          COMMIT_MESSAGE: 'chore(release): set crate version to ${{ inputs.version }}'
          FILE_PATHS: Cargo.toml,Cargo.lock

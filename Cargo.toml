[package]
name = "vigil-telemetry"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "vigil — Verifiable Integrity-Guarded Instrumentation & Logging: opinionated OpenTelemetry (OTLP/JSON Lines) logs, metrics and traces for Rust, plus an opt-in hash-chained, signed audit trail"
license = "Apache-2.0"
repository = "https://github.com/vig-os/vigil"
readme = "README.md"
keywords = ["opentelemetry", "otlp", "logging", "audit-trail", "tracing"]
categories = ["development-tools::debugging"]

[lib]
# The crates.io name `vigil` is taken (an unrelated deadlock watchdog), so the
# package is `vigil-telemetry` while code still writes `vigil::init(...)`.
name = "vigil"

[dependencies]
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["logs"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["logs", "gen-tonic-messages", "with-serde"] }
serde_json = "1"
rustix = { version = "1.1.5", features = ["fs"] }
opentelemetry-appender-tracing = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter", "fmt"] }
tracing-log = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
log = "0.4"
